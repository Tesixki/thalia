name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5

      # CIA を作る道具（版を固定し、中身を SHA-256 で確かめてから使う）
      # makerom は v0.19 だと glibc 2.38 が必要で、devkitARM のコンテナ（Debian 12）では動かないため v0.18.4 を使う
      - name: Install makerom and bannertool
        run: |
          apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null
          mkdir -p /opt/ctrtools && cd /opt/ctrtools
          curl -sSfL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -sSfL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          echo "dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  makerom.zip" | sha256sum -c -
          echo "69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip" | sha256sum -c -
          unzip -o -q makerom.zip
          unzip -o -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool
          echo /opt/ctrtools >> "$GITHUB_PATH"

      - name: Build (3dsx + cia)
        run: make cia

      - uses: actions/upload-artifact@v4
        with:
          name: thalia
          path: |
            thalia.3dsx
            thalia.cia

      # v で始まるタグを push したら Releases に置く（README の QR コードはここの thalia.cia を指す）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Thalia ${{ github.ref_name }}
          files: |
            thalia.3dsx
            thalia.cia
            docs/qr.png
          generate_release_notes: true
